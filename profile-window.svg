<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
  <title id="title">lmyoji — Algorithms and AI Agents</title>
  <desc id="desc">A soft pink and blue profile header. Go, Python, Algorithms and AI Agents, with a readable three-line code editor and a small white rabbit resting its paws on the upper-right corner.</desc>
