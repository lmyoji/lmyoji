    <filter id="editorShadow" x="-20%" y="-30%" width="140%" height="170%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="rabbitShadow" x="-30%" y="-20%" width="160%" height="150%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="canvas"><rect width="1100" height="480" rx="22"/></clipPath>
