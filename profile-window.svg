    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".91"/><stop offset="1" stop-color="#fff" stop-opacity=".68"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f580aa"/><stop offset="1" stop-color="#f16c93"/></linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#fff"/><stop offset=".43" stop-color="#fffafb"/><stop offset=".75" stop-color="#f8edf4"/><stop offset="1" stop-color="#c7dfee"/></linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#cde5f0"/><stop offset=".35" stop-color="#fffdfd"/><stop offset=".7" stop-color="#fff3f5"/><stop offset="1" stop-color="#e9c9d8"/></linearGradient>
