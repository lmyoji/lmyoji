    <radialGradient id="blush"><stop stop-color="#f8b3c8" stop-opacity=".9"/><stop offset="1" stop-color="#f8b3c8" stop-opacity="0"/></radialGradient>
    <radialGradient id="eye" cx=".36" cy=".22" r=".9"><stop stop-color="#765363"/><stop offset=".55" stop-color="#493945"/><stop offset="1" stop-color="#b78794"/></radialGradient>
